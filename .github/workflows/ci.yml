---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.4"
      - name: Install dependencies
        run: uv venv && uv pip install -r requirements.txt
      - name: Run Pytest
        run: uv run pytest tests/
        env:
          AZION_TOKEN: test
          DD_API_KEY: test
          DD_APP_KEY: test
          OLLAMA_MODEL: test
          GOOGLE_API_KEY: test

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install
      - name: Run Vitest
        run: pnpm test
